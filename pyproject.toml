[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.28", "fastapi>=0.115", "gitignore-parser>=0.1"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
