[project]
name = "miniviki-core"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["miniviki-sandbox", "httpx>=0.28", "yarl>=1.18"]

[tool.uv.sources]
miniviki-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniviki"]
