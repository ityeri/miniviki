[project]
name = "llm-interface"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ityeri", email = "ityeri9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24"
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.build-backend]
module-name = "miniviki.llm_interface"
