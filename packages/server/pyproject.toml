[project]
name = "miniviki-server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "miniviki-core",
    "miniviki-mca @ git+https://github.com/ityeri/mca.git@develop",
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "uvicorn>=0.34",
    "reger>=0.1.3",
]

[tool.uv.sources]
miniviki-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniviki"]

[tool.hatch.metadata]
allow-direct-references = true
